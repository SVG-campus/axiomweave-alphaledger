[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomweave-alphaledger"
version = "0.4.0"
description = "Evidence-gated Alpaca paper-options agent with deterministic competition controls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["streamlit>=1.37,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ai = ["openai>=2.16,<3", "pydantic>=2,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
